version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/swiftgate.db
      - ENV=production
      - TOKEN_MARGIN=0.01
      - ADMIN_KEY=${ADMIN_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Set these to enable the gateway proxy
      # - OPENAI_API_KEY=sk-...
      # - ANTHROPIC_API_KEY=sk-ant-...
      # - DEEPINFRA_API_KEY=...
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-3001}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  landing:
    build:
      context: .
      dockerfile: landing/Dockerfile
    ports:
      - "${LANDING_PORT:-3002}:80"
    restart: unless-stopped

volumes:
  backend-data:
